# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
# Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cloud Configuration
cloud.localstack.endpoint=http://localhost:4566
cloud.localstack.region=us-east-1
cloud.aws.region=us-east-1
aws.access-key=test
aws.secret-key=test

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:4200

# Application Configuration
app.dashboard.refresh-interval=30
app.ml.prediction-horizon=24
app.alerts.enabled=true
app.recommendations.auto-execute=false

# Logging
logging.level.com.optibrain=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
