# OptiBrain AWS Cost Optimization Platform
# Default Configuration - Uses development profile by default
# 
# To use production profile: java -jar app.jar --spring.profiles.active=prod
# To use development profile: java -jar app.jar --spring.profiles.active=dev
#
# Active profile can also be set via environment variable: SPRING_PROFILES_ACTIVE=prod

# Default to development profile for safety
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Application Name
spring.application.name=OptiBrain Cost Intelligence

# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration - H2 for default/dev
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Cloud Configuration - LocalStack for default/dev
# Note: Requires LocalStack running on http://localhost:4566
# Start LocalStack: docker run -d -p 4566:4566 -e SERVICES=ec2,cloudwatch,sts localstack/localstack
cloud.mode=${CLOUD_MODE:LOCALSTACK}
cloud.localstack.endpoint=${LOCALSTACK_ENDPOINT:http://localhost:4566}
cloud.localstack.region=${LOCALSTACK_REGION:us-east-1}
cloud.aws.region=${AWS_REGION:us-east-1}
aws.access-key=${AWS_ACCESS_KEY_ID:test}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:test}

# CORS Configuration
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

# Application Configuration
app.demo-mode=false
app.dashboard.refresh-interval=${DASHBOARD_REFRESH_INTERVAL:30}
app.ml.prediction-horizon=${ML_PREDICTION_HORIZON:24}
app.alerts.enabled=${ALERTS_ENABLED:true}
app.recommendations.auto-execute=${AUTO_EXECUTE_RECOMMENDATIONS:false}

# Cost Analysis Configuration
app.cost.idle-cpu-threshold=${IDLE_CPU_THRESHOLD:10}
app.cost.idle-days-threshold=${IDLE_DAYS_THRESHOLD:7}
app.cost.unused-ebs-days=${UNUSED_EBS_DAYS:30}

# Logging
logging.level.root=INFO
logging.level.com.optibrain=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ML Service Configuration
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
