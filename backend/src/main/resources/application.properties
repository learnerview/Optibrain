# OptiBrain AWS Cost Optimization Platform
# Default Configuration - Uses development profile by default
# 
# To use production profile: java -jar app.jar --spring.profiles.active=prod
# To use development profile: java -jar app.jar --spring.profiles.active=dev
#
# Active profile can also be set via environment variable: SPRING_PROFILES_ACTIVE=prod

# Default to development profile for safety
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Application Name
spring.application.name=OptiBrain Cost Intelligence

# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration - SQLite for default/dev, PostgreSQL via DB_URL in prod
spring.datasource.url=jdbc:sqlite:${SQLITE_DB:./data/optibrain.db}
spring.datasource.driverClassName=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# JPA Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Cloud Configuration
# Two execution targets, one code path:
#   SANDBOX - AWS SDK calls are routed to a LocalStack container (default, safe)
#   AWS     - AWS SDK calls go to real AWS endpoints using the ambient credential chain
# Start LocalStack: docker compose up -d localstack   (see compose.yaml at repo root)
cloud.mode=${CLOUD_MODE:SANDBOX}
cloud.sandbox.endpoint=${SANDBOX_ENDPOINT:http://localhost:4566}
cloud.aws.region=${AWS_REGION:us-east-1}
cloud.aws.cost-explorer-region=${AWS_COST_EXPLORER_REGION:us-east-1}
# In AWS mode a tenant without awsRoleArn is refused (fail closed) instead of silently
# using this instance's ambient account; only a deliberate single-account deployment
# opts into the ambient chain. Ignored in SANDBOX mode.
cloud.aws.allow-ambient-fallback=${CLOUD_AWS_ALLOW_AMBIENT_FALLBACK:false}
# Safety interlock. Leave true unless you intend changes to reach real infrastructure.
cloud.dry-run=${CLOUD_DRY_RUN:true}

# CORS Configuration
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

# Application Configuration
app.dashboard.refresh-interval=${DASHBOARD_REFRESH_INTERVAL:30}
app.ml.prediction-horizon=${ML_PREDICTION_HORIZON:24}
app.alerts.enabled=${ALERTS_ENABLED:true}
app.recommendations.auto-execute=${AUTO_EXECUTE_RECOMMENDATIONS:false}

# JWT authentication
app.jwt.secret=${JWT_SECRET:OPTIBRAIN_DEV_JWT_SECRET_MEAN_CHANGE_IN_PROD_000}
app.jwt.expiration-ms=86400000

# Cost Analysis Configuration
app.cost.idle-cpu-threshold=${IDLE_CPU_THRESHOLD:10}
app.cost.idle-days-threshold=${IDLE_DAYS_THRESHOLD:7}

# Logging
logging.level.root=INFO
logging.level.com.optibrain=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ML Service Configuration
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.api-key=${ML_SERVICE_API_KEY:dev-local-ml-api-key}
