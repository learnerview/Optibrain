# Production Profile Configuration
# This profile is for production deployment with real AWS services

# Server Configuration
server.port=8080

# Database Configuration - PostgreSQL for production
# Configure these via environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/optibrain}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:optibrain}
spring.datasource.password=${DB_PASSWORD}
spring.h2.console.enabled=false

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Cloud Configuration - Real AWS
cloud.mode=AWS
cloud.aws.region=${AWS_REGION:us-east-1}
# AWS credentials should be provided via IAM roles or environment variables
# Never hardcode credentials in production
aws.access-key=${AWS_ACCESS_KEY_ID:}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:}

# CORS Configuration - Restrict in production
cors.allowed-origins=${ALLOWED_ORIGINS:https://your-production-domain.com}

# Application Configuration
app.demo-mode=false
app.dashboard.refresh-interval=60
app.ml.prediction-horizon=168
app.alerts.enabled=true
app.recommendations.auto-execute=false

# Logging - Production level
logging.level.root=WARN
logging.level.com.optibrain=INFO
logging.level.org.springframework.web=WARN
logging.level.software.amazon.awssdk=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator - Restricted in production
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ML Service Configuration
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
