# Production Profile Configuration
# This profile is for production deployment with real AWS services

# Server Configuration
server.port=8080

# Database Configuration - PostgreSQL for production
# IMPORTANT: DB_PASSWORD environment variable is required for production
# Configure these via environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/optibrain}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:optibrain}
spring.datasource.password=${DB_PASSWORD}
spring.h2.console.enabled=false

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Cloud Configuration - Real AWS
cloud.mode=AWS
cloud.aws.region=${AWS_REGION:us-east-1}
cloud.aws.cost-explorer-region=${AWS_COST_EXPLORER_REGION:us-east-1}
# Credentials are resolved by AwsClientFactory via DefaultCredentialsProvider: prefer an
# IAM role, and otherwise set AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in the
# environment. They are deliberately NOT configurable here - a credential in a properties
# file is a credential in version control.
# Safety interlock. Setting this false allows real destructive changes; keep it true until
# the remediation policy and approval flow have been reviewed.
cloud.dry-run=${CLOUD_DRY_RUN:true}

# CORS Configuration - Restrict in production
cors.allowed-origins=${ALLOWED_ORIGINS:https://your-production-domain.com}

# Application Configuration
app.dashboard.refresh-interval=60
app.ml.prediction-horizon=168
app.alerts.enabled=true
app.recommendations.auto-execute=false

# Logging - Production level
logging.level.root=WARN
logging.level.com.optibrain=INFO
logging.level.org.springframework.web=WARN
logging.level.software.amazon.awssdk=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator - Restricted in production
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ML Service Configuration
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
