# Development Profile Configuration
# This profile is for local development and testing with LocalStack

# Server Configuration
server.port=8080

# Database Configuration - SQLite for development
spring.datasource.url=jdbc:sqlite:${SQLITE_DB:./data/optibrain-dev.db}
spring.datasource.driverClassName=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.h2.console.enabled=false

# JPA Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cloud Configuration - LocalStack sandbox for development
cloud.mode=${CLOUD_MODE:SANDBOX}
cloud.sandbox.endpoint=${SANDBOX_ENDPOINT:http://localhost:4566}
cloud.aws.region=${AWS_REGION:us-east-1}
cloud.dry-run=true

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:4200

# Application Configuration
app.dashboard.refresh-interval=30
app.ml.prediction-horizon=24
app.alerts.enabled=true
app.recommendations.auto-execute=false

# Logging
# Application code is DEBUG in development. The AWS SDK is held at WARN even here: at
# DEBUG it prints full canonical requests and SigV4 signature material, which buries real
# application logs and has no diagnostic value for this codebase. Raise it to
# software.amazon.awssdk.request=DEBUG only when investigating a specific AWS call.
logging.level.root=INFO
logging.level.com.optibrain=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.software.amazon.awssdk=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always

# ML Service Configuration
ml.service.url=http://localhost:8000
