name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
      - name: Run backend tests
        run: |
          cd backend
          ./mvnw clean test
      - name: Build backend
        run: |
          cd backend
          ./mvnw package -DskipTests

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      - name: Install dependencies
        run: |
          cd services/ai-service
          pip install -r requirements.txt
      - name: Lint
        run: |
          cd services/ai-service
          python -m py_compile *.py
      - name: Run basic test
        run: |
          cd services/ai-service
          python -c "from predictor import AdvancedPredictor; from anomaly_detector import AnomalyDetector; print('OK')"
